<!DOCTYPE html>
<html>
<head>
  
<link rel="stylesheet" href="styles2.css">

  <title>Student Dashboard</title>
  <meta charset="UTF-8">
  <script>
    function logout() {
      window.location.href = "index.html";
    }

    function showForm(eventId) {
      document.getElementById(`form-${eventId}`).style.display = 'block';
    }

    function showNotification(msg) {
      alert(msg);
    }
  </script>
</head>
<body>
  

  <div class="header">
  <h1>Student Dashboard</h1>
  <button onclick="logout()">Logout</button>
</div>


  <h2>Available Events</h2>
  <div id="events"></div>

  <script>
    function formatDescription(text) {
  const lines = text.split('\n');
  let formatted = '';
  lines.forEach(line => {
    if (line.trim().startsWith('*') || line.trim().startsWith('-')) {
      if (!formatted.endsWith('<ul>')) {
        formatted += '<ul>';
      }
      formatted += `<li>${line.replace(/^(\*|-)\s*/, '')}</li>`;
    } else {
      if (formatted.endsWith('</ul>')) {
        formatted += '</ul>';
      }
      formatted += `<p>${line}</p>`;
    }
  });
  if (formatted.includes('<ul>') && !formatted.endsWith('</ul>')) {
    formatted += '</ul>';
  }
  return formatted;
}

    fetch('/student/events')
      .then(res => res.json())
      .then(events => {
        const container = document.getElementById('events');
        if (events.length === 0) {
          container.innerHTML = "<p>No events available.</p>";
        } else {
          events.forEach(event => {
            const div = document.createElement('div');
            div.innerHTML = `
              <h3>${event.title}</h3>
              <p>${formatDescription(event.description)}</p>

              <p><strong>Date:</strong> ${event.date}</p>
              <button onclick="showForm('${event._id}')">Register</button>
              <div id="form-${event._id}" style="display:none;">
                <form action="/student/register" method="POST" onsubmit="showNotification('Registered successfully!')">
                  <input type="hidden" name="event_id" value="${event._id}">
                  <input type="text" name="student_name" placeholder="Your Name" required><br>
                  <input type="email" name="email" placeholder="Email" required><br>
                  <input type="text" name="phone" placeholder="Phone Number" required><br>
                  <input type="text" name="year" placeholder="Year" required><br>
                  <input type="text" name="branch" placeholder="Branch" required><br>
                  <button type="submit">Submit</button>
                </form>
              </div>
              <hr>
            `;
            container.appendChild(div);
          });
        }
      });
  </script>
</body>
</html>
