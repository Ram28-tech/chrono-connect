<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Analytics</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333;
    }

    /* Header */
    .header {
      background: linear-gradient(to right, #3b82f6, #6366f1);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 40px;
     
    }

    .header h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 14px;
    }

    h3 {
      margin-top: 30px;
      margin-bottom: 16px;
      color: #1e3a8a;
    }

    .download-btn {
      margin-right: 20px;
      background: linear-gradient(to right, #06b6d4, #3b82f6);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease;
      margin-bottom: 20px;
    }

    .download-btn:hover {
      transform: scale(1.05);
    }

    .chart-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 50px;
    }

    .bar-chart-box {
      height: 400px;
    }

    .pie-charts {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .pie-chart-box {
      width: 450px;
      height: 450px;
    }

    .pie-chart-box h3 {
      text-align: center;
      color: #1e40af;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <!-- Elegant Header -->
  <div class="header">
    <h1>📊 Event Analytics</h1>
  </div>

  <div class="container">
    
    <div class="button-container">
      <a href="/faculty/export-all-registrations">
        <button class="download-btn">📥 Export All Registrations</button>
      </a>

      <a href="/faculty/export-registrations" target="_blank">
        <button class="download-btn">📥 Export Event-wise Registrations</button>
      </a>
    </div>

    <!-- Bar Chart -->
    <h3>Registrations per Event</h3>
    <div class="chart-container bar-chart-box">
      <canvas id="registrationsChart"></canvas>
    </div>

    <!-- Pie Charts -->
    <div class="chart-container pie-charts">
      <div class="pie-chart-box">
        <h3>Registrations by Branch</h3>
        <canvas id="branchChart"></canvas>
      </div>
      <div class="pie-chart-box">
        <h3>Registrations by Year</h3>
        <canvas id="yearChart"></canvas>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script>
    fetch('/faculty/analytics')
      .then(res => res.json())
      .then(data => {
        const { eventTitles, registrationCounts, branchStats, yearStats } = data;

        new Chart(document.getElementById('registrationsChart'), {
          type: 'bar',
          data: {
            labels: eventTitles,
            datasets: [{
              label: 'Registrations per Event',
              data: registrationCounts,
              backgroundColor: 'rgba(59, 130, 246, 0.7)',
              borderColor: 'rgba(59, 130, 246, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  stepSize: 1
                }
              }
            }
          }
        });

        new Chart(document.getElementById('branchChart'), {
          type: 'doughnut',
          data: {
            labels: Object.keys(branchStats),
            datasets: [{
              data: Object.values(branchStats),
              backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#6366f1']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });

        new Chart(document.getElementById('yearChart'), {
          type: 'pie',
          data: {
            labels: Object.keys(yearStats),
            datasets: [{
              data: Object.values(yearStats),
              backgroundColor: ['#06b6d4', '#6366f1', '#f43f5e', '#22c55e']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
      });
  </script>
</body>
</html>
